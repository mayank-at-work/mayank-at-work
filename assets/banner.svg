<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mayank Tiwari — Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- Left: identity -->
  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <text x="64" y="92" fill="#94A3B8" font-size="18" letter-spacing="3" font-weight="600">FULL-STACK · BACKEND ENGINEER</text>
    <text x="62" y="158" fill="#F8FAFC" font-size="60" font-weight="700">Mayank Tiwari</text>
    <rect x="64" y="178" width="120" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="222" fill="#CBD5E1" font-size="21">I own products end-to-end — from spec and API design</text>
    <text x="64" y="252" fill="#CBD5E1" font-size="21">to UI, CI/CD and production support.</text>
    <text x="64" y="290" fill="#64748B" font-size="16">Delhi, India  ·  Clients in India, Canada &amp; UAE</text>
  </g>

  <!-- Right: terminal card -->
  <g transform="translate(748,52)">
    <rect width="392" height="216" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect width="392" height="34" rx="12" fill="#1E293B"/>
    <rect y="22" width="392" height="12" fill="#1E293B"/>
    <circle cx="20" cy="17" r="6" fill="#F87171"/>
    <circle cx="40" cy="17" r="6" fill="#FBBF24"/>
    <circle cx="60" cy="17" r="6" fill="#34D399"/>
    <text x="196" y="22" text-anchor="middle" fill="#64748B" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13">~/mayank</text>
    <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15">
      <text x="20" y="66"><tspan fill="#34D399">$</tspan><tspan fill="#E2E8F0"> whoami --work</tspan></text>
      <text x="20" y="98"><tspan fill="#818CF8">backend</tspan><tspan x="112" fill="#E2E8F0">PHP · Laravel · Node</tspan></text>
      <text x="20" y="124"><tspan fill="#818CF8">frontend</tspan><tspan x="112" fill="#E2E8F0">React · JS · PWA</tspan></text>
      <text x="20" y="150"><tspan fill="#818CF8">data</tspan><tspan x="112" fill="#E2E8F0">MySQL · Postgres · Redis</tspan></text>
      <text x="20" y="176"><tspan fill="#818CF8">ops</tspan><tspan x="112" fill="#E2E8F0">GitHub Actions · n8n</tspan></text>
      <text x="20" y="202"><tspan fill="#22D3EE">ships</tspan><tspan x="112" fill="#E2E8F0">spec → API → UI → prod</tspan></text>
    </g>
  </g>
</svg>
